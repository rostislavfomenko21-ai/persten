name: fetch-site
on:
  push:
    paths:
      - '.github/workflows/fetch-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download site from Google Drive and commit
        run: |
          curl -sSL 'https://drive.usercontent.google.com/download?id=1zkfgDHvHyqneFW0Is0PpwbPiy2vWMvzA&export=download&confirm=t' -o new.html
          echo '1b45f54d1a8baab51664505567dd420e451a9a08f56697ec9123cfcf5d0082e4  new.html' | sha256sum -c
          mv new.html index.html
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html .nojekyll
          git diff --cached --quiet && exit 0
          git commit -m 'Rewrite exhibition texts in plain language, remove status labels and footer'
          git push
