name: fetch-site
on:
  push:
    paths:
      - '.github/workflows/fetch-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download site from Google Drive and commit
        run: |
          curl -sSL 'https://drive.usercontent.google.com/download?id=19pOe0QNWEX4RvZpFHHHUQETq_yUAOeUu&export=download&confirm=t' -o new.html
          echo '431d8205b9b3a6f86caeaae2a7667e35e6d2fa7d9dfc25dbecddaa8e08e74c4f  new.html' | sha256sum -c
          mv new.html index.html
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html .nojekyll
          git diff --cached --quiet && exit 0
          git commit -m 'Update exhibition site: author data, quotes, Telegram sources'
          git push
